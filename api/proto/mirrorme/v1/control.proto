syntax = "proto3";

package mirrorme.v1;

import "google/protobuf/empty.proto";
import "mirrorme/v1/events.proto";
import "mirrorme/v1/form.proto";
import "mirrorme/v1/session.proto";
import "mirrorme/v1/settings.proto";
import "mirrorme/v1/text.proto";

option go_package = "bjoernblessin.de/mirrorme/api/gen/go/mirrorme/v1;mirrormev1";
option csharp_namespace = "MirrorMe.Api.V1";

// The whole surface a shell may reach.
// No shared file the shell parses, no relay endpoint it calls directly,
// no environment variable it reads to learn a port.
//
// Six methods, and the division between them is the boundary rule (docs/ipc-api.md):
//
//   Read   hands over every named state, whole, as the backend holds it now.
//   Watch  hands over every named state, whole, each time it moves.
//   Ask    computes an answer from its arguments and changes nothing.
//   Set    makes a state true. A state that already holds is a success.
//   Do     runs one effect that leaves no state a later Set could name.
//
// Every state is one EventKind, and the same Event message carries it on Read and on Watch,
// so a state has one shape wherever it crosses.
// A wish for a method beyond these is a shell about to hold state the backend owns.
service ControlService {
  // First call on a connection.
  // Settles the contract major before any other method is reached,
  // so a mismatch is stated rather than arriving as a field that is silently empty.
  rpc Hello(HelloRequest) returns (HelloResponse);

  rpc Read(ReadRequest) returns (ReadResponse);

  // Delivers the named kinds for as long as the shell holds the call.
  // A shell opens one call per cadence:
  // state kinds move when something happened,
  // audio levels on a fixed tick, the pointer at the rate it moves.
  // Folding them into one call would re-render every state reader at metering rate.
  rpc Watch(WatchRequest) returns (stream Event);

  // Cheap enough to call on every keystroke.
  rpc Ask(AskRequest) returns (AskResponse);

  // Answers empty.
  // What the state became arrives on Watch, which is the one path into the display:
  // the window that acted and the window that watched learn one fact one way.
  rpc Set(SetRequest) returns (google.protobuf.Empty);

  // Answers the outcome an effect leaves with its caller, empty where it leaves none.
  // Each effect here reaches something this process does not own, or takes seconds,
  // so none of them runs on a keystroke.
  rpc Do(DoRequest) returns (DoResponse);
}

// --- Handshake ------------------------------------------------------------------

message HelloRequest {
  // What the shell calls itself, for the backend's log: "avalonia", "cli".
  // It carries no behaviour.
  string client = 1;
  // Contract version the shell was generated against.
  // A major the backend does not implement is refused with FAILED_PRECONDITION,
  // with both versions named.
  uint32 protocol_major = 2;
}

message HelloResponse {
  // A shell built against a lower minor works,
  // and one built against a higher minor may find a kind or an arm missing.
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  // The build, for display and for bug reports.
  string backend_version = 3;
}

// --- Read and Watch ---------------------------------------------------------------

message ReadRequest {
  // At least one.
  // A state kind is read as it stands.
  // An exit, a sample and a tick happen rather than stand, so naming one is INVALID_ARGUMENT.
  repeated EventKind kinds = 1;
}

message ReadResponse {
  // One per kind asked for, in the order asked.
  repeated Event states = 1;
}

message WatchRequest {
  // Empty receives every state, exit and sample kind.
  // EVENT_KIND_AUDIO_LEVELS and EVENT_KIND_POINTER arrive only where named,
  // being the two kinds that move at a cadence of their own.
  //
  // EVENT_KIND_UNSPECIFIED is refused rather than ignored.
  // A shell naming a kind this build's enum has no value for learns it on that call,
  // rather than by waiting forever.
  repeated EventKind kinds = 1;
  // Whose pointer EVENT_KIND_POINTER follows, unset being this machine's own publish.
  // The publish reads its own capture,
  // and a watched stream carries the position in its frames.
  StreamRef pointer_of = 2;
}

// --- Ask --------------------------------------------------------------------------

message AskRequest {
  oneof question {
    // A settings draft, answered by the complete description of the screen:
    // every field, every option, every greying and its reason, the diagnostics and the derived figures.
    // The whole draft, because availability is a function of every field at once.
    // Reads what has been probed rather than probing, and saves nothing.
    Settings form = 1;
    // A link this machine was handed: "mirrorme://watch/<group id>/<stream>".
    // Refused where the link names a group this machine is not in, the reason naming the way in.
    string link = 2;
  }
}

message AskResponse {
  oneof answer {
    Form form = 1;
    // The stream the link opens, as RelayPath.name spells it.
    // The name alone: which leg a tile receives over is decided at one site of the shell's own
    // (avalonia, Features/Viewer/Tile/Model/TileLeg.cs).
    string stream_name = 2;
  }
}

// --- Set --------------------------------------------------------------------------

message SetRequest {
  oneof state {
    // The stored settings.
    // Touches no running stream: a live pipeline takes settings through `publish`,
    // both engines running a child built from an argv.
    // Writing the group key or the display name is what joins and leaves a group.
    Settings settings = 1;
    PresetWanted preset = 2;
    PublishWanted publish = 3;
    ViewerWanted viewer = 4;
    ReceiveWanted receive = 5;
    ReceiveAudio receive_audio = 6;
    MonitorPreviewWanted monitor_preview = 7;
    // How many synthetic publishers run, zero being none.
    // Each runs its own software encoder, so a count above the backend's bound is RESOURCE_EXHAUSTED.
    // A running set of another size is replaced.
    int32 test_streams = 8;
    DiscordLinkWanted discord_link = 9;
  }
}

// One way of publishing, stored under its name, or no preset of that name.
// A preset holds a PublishSettings and nothing else:
// where the relay is belongs to a deployment, how this machine watches to a viewer.
message PresetWanted {
  string name = 1;
  // Absent drops the preset, present replaces a same-named one.
  PublishSettings settings = 2;
}

// Whether a stream is on the air, and on which settings.
//
// Live on settings no stream runs starts one, persisting them.
// Live on other settings than the running stream's restarts it on them,
// the command rendered before anything is torn down,
// so a combination no engine builds is refused and the stream goes on running what it has.
// A launch that fails after the teardown leaves nothing publishing.
// Live on the running stream's own settings changes nothing.
// Not live ends the stream, a retry backoff included, a stop being the one answer the retry budget has no say in.
message PublishWanted {
  bool live = 1;
  // The whole Settings rather than the two groups a pipeline is built from,
  // because a live answer persists the draft it is given,
  // and half of it arriving would leave the other half at whatever was stored before.
  // Ignored where live is false.
  Settings settings = 2;
}

// An external player for one stream over one leg.
// A leg that cannot carry the stream's format is refused with the format named.
message ViewerWanted {
  StreamRef viewer = 1;
  bool open = 2;
}

// A decode of one stream over one leg, inside the backend,
// its frames reaching the shell over the frame channel (docs/viewer-architecture.md).
// The leg is named here rather than read off ViewerSettings: the setting is what a shell offers, and the call is what was chosen.
// A leg that cannot carry the stream's format is refused with the format named.
message ReceiveWanted {
  StreamRef stream = 1;
  bool open = 2;
  // Rolls an HDR stream down into the range a standard display shows.
  // A build choice, so a decode running with the other answer is rebuilt.
  // Stored nowhere: it lives as long as the decode does.
  // A machine with no element for it builds the decode without one and reports so on ReceiveStream.
  bool tone_map = 3;
}

// How loud one decode plays, and whether it plays at all.
// One message because they are one state.
// Two windows on one decode share one audio branch, so loudness belongs to the decode.
// A volume set before the decoder exposed an audio pad is held until it does.
// A decode that does not exist is NOT_FOUND.
message ReceiveAudio {
  StreamRef stream = 1;
  // Slider position from zero to one, played at its cube as linear gain (docs/viewer-architecture.md).
  // The backend bounds values above one rather than letting a slider clip the output device.
  double volume = 2;
  // Silences the branch and keeps the volume.
  bool muted = 3;
}

// One of this machine's monitors read into a picture the frame channel hands over,
// so a screen is chosen by looking at it.
// Nothing is encoded and nothing leaves the machine.
// A monitor no output is enumerated under is INVALID_ARGUMENT.
// FAILED_PRECONDITION where the session cannot read one screen apart from another,
// which Catalog.no_monitor_preview states beforehand.
message MonitorPreviewWanted {
  // Index Catalog.Monitor is enumerated under, the value PublishSettings.monitor holds.
  int32 monitor = 1;
  bool open = 2;
}

// This install's link to a Discord account (docs/discord-mode.md).
//
// Linking opens the browser on the manager's consent flow,
// catches the redirect on a loopback port, and stores the link secret it lands with,
// so the call answers when the link landed, failed or was cancelled.
// Unlinking drops the secret from the stored settings and revokes nothing at the manager.
message DiscordLinkWanted {
  bool linked = 1;
  // The relay whose manager runs the consent flow, from the draft on screen.
  // Ignored where linked is false.
  RelaySettings relay = 2;
}

// --- Do ---------------------------------------------------------------------------

message DoRequest {
  oneof action {
    // Opens the relay's own player page in the default browser,
    // over a leg the relay serves a page for (Catalog.browser_watch_transports).
    // Nothing appears in ViewerState and there is no stop: the tab belongs to the browser.
    StreamRef open_in_browser = 1;
    // Test-encodes on every engine and records what this machine can really run.
    // Seconds on the first call and nothing afterwards.
    // The catalog it lands reaches every shell on Watch.
    google.protobuf.Empty probe_encoders = 2;
    // Probes this machine's real upload throughput.
    // FAILED_PRECONDITION while a stream publishes, the stream competing for the line.
    google.protobuf.Empty measure_uplink = 3;
    // Times the encoder these settings name on generated frames of their monitor's size.
    // FAILED_PRECONDITION while a stream publishes, the stream competing for the silicon.
    Settings measure_encode_rate = 4;
    // Dials every leg of the relay these settings name, in each leg's own protocol.
    // A reading of the moment, so a live stream does not refuse it.
    Settings check_relay = 5;
    // Reads the published release, and fetches it where this install replaces its own files.
    // Returns at once, every step reaching every shell as UpdateState.
    // FAILED_PRECONDITION where UpdateState.unchecked stands.
    google.protobuf.Empty check_update = 6;
    // Starts the staged release, the applier waiting for this app to close (docs/updates.md).
    // FAILED_PRECONDITION below UPDATE_STAGE_READY.
    google.protobuf.Empty install_update = 7;
    // Drops the stored screen-capture consent, so the next capture asks the compositor to pick again.
    google.protobuf.Empty forget_portal_consent = 8;
    // Draws a group key at the relay's group service, from the draft on screen, without storing it.
    // Holding the key is membership, so the shell writes it to the settings like any other value.
    RelaySettings create_group = 9;
    // Opens one run log in the default application.
    // The path is one the backend handed out on an ExitInfo, never one a shell builds.
    string open_log = 10;
    google.protobuf.Empty open_logs_folder = 11;
    // Sends one report to the group service beside the stored relay:
    // what this machine is, the settings with every secret blanked, and the newest run logs' tails.
    // The press is the consent.
    // FAILED_PRECONDITION where the settings name no relay.
    google.protobuf.Empty send_report = 12;
  }
  // open_in_browser, open_log, open_logs_folder and send_report repeat on a second call:
  // the effect lands in a program or a store this one does not own,
  // and nothing reads back to tell a second call it had already happened (docs/development-principles.md).
}

message DoResponse {
  oneof outcome {
    // measure_uplink, in Mbit/s.
    double uplink_mbps = 1;
    EncodeRate encode_rate = 2;
    RelayCheck relay_check = 3;
    Group group = 4;
    // What the service stored a report under, which a reader quotes to whoever reads it.
    string report_id = 5;
  }
}

message RelayCheck {
  // One per leg, ordered by name.
  repeated RelayLeg legs = 1;
}

// One listener of the relay and what it answered.
message RelayLeg {
  // Transport registry name, or one of the two services no transport carries:
  // "srt", "rtsp", "rtmp", "hls", "webrtc", "moq", "groups", "api".
  string leg = 1;
  // Where it was dialled, as a reader would type it: "rtsps://relay:8322".
  // Empty exactly under RELAY_LEG_VERDICT_UNADDRESSED.
  string address = 2;
  RelayLegVerdict verdict = 3;
  // What the listener answered, or the failure the dial reported.
  // Another machine's words (text.proto), so nothing matches on it.
  // Empty where nothing was dialled.
  string detail = 4;
  // Why nothing here uses this leg,
  // present exactly under RELAY_LEG_VERDICT_UNADDRESSED and RELAY_LEG_VERDICT_UNUSED.
  Text unused = 5;
  // How long the probe waited, absent where nothing was dialled.
  optional int64 waited_ms = 6;
  // The version the listener named for itself, absent where it named none.
  optional string version = 7;
}

enum RelayLegVerdict {
  RELAY_LEG_VERDICT_UNSPECIFIED = 0;
  // The listener answered, in the protocol its address names.
  RELAY_LEG_VERDICT_REACHABLE = 1;
  // Nothing answered, or what answered speaks something else.
  RELAY_LEG_VERDICT_UNREACHABLE = 2;
  // This deployment sends nothing here, so nothing was dialled, and `unused` says why.
  RELAY_LEG_VERDICT_UNADDRESSED = 3;
  // The listener answered, and nothing this machine does uses it, which `unused` says.
  RELAY_LEG_VERDICT_UNUSED = 4;
}

message Group {
  // The secret, as it goes into the group key field and to whoever should be able to watch.
  string key = 1;
  // The path prefix the key derives, which appears in every URL of the group.
  // Not a secret, and shown so a member can tell one group's streams from another's.
  string id = 2;
}
